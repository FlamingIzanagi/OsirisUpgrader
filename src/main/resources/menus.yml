file-version: 4

# Slots de 0 a 53 en un cofre doble.
# El título acepta & y hex (&#RRGGBB, #RRGGBB o &x&R&R&G&G&B&B)
# y MiniMessage: <color:#e5be01>texto</color> <bold> <dark_gray> <reset>.
# wheel-slots va en sentido horario y el primero es la aguja, donde se ve el porcentaje.
# Los slots que no estén ocupados por un botón o un ítem se rellenan con filler.
upgrader:
  title: "&8Ruleta"
  size: 54
  slots:
    origin: 20
    bet-info: 19
    target: 24
    # El girar ocupa el centro. La probabilidad va en la aguja, no en un slot aparte.
    chance: -1
    spin: 22
    guide: 0
    plus-1: 17
    plus-15: 26
    plus-32: 35
    # Justo debajo de la fila roja inferior de la ruleta (slots 30, 31 y 32).
    multiplier-x2: 39
    multiplier-x4: 40
    multiplier-x8: 41
  wheel-slots: [13, 14, 23, 32, 31, 30, 21, 12]
  filler:
    material: BLACK_STAINED_GLASS_PANE
    custom-model-data: 0
    name: " "
  icons:
    chance: SUNFLOWER
    spinning: CLOCK
    spin: SUNFLOWER
    # material, custom-model-data y nexo-id. Si nexo-id tiene valor, se usa ese ítem.
    # También puedes escribir solo el material: plus-1: GOLD_NUGGET
    plus-1:
      material: GOLD_NUGGET
      custom-model-data: 0
      nexo-id: ""
    plus-15:
      material: GOLD_INGOT
      custom-model-data: 0
      nexo-id: ""
    plus-32:
      material: GOLD_BLOCK
      custom-model-data: 0
      nexo-id: ""
    multiplier-x2:
      material: LAPIS_LAZULI
      custom-model-data: 0
      nexo-id: ""
    multiplier-x4:
      material: LAPIS_LAZULI
      custom-model-data: 0
      nexo-id: ""
    multiplier-x8:
      material: LAPIS_LAZULI
      custom-model-data: 0
      nexo-id: ""
    target-empty: ECHO_SHARD
    guide: BOOK
    # Cartel de la apuesta. No copia el ítem apostado: solo cambian nombre y lore.
    bet-info:
      material: NAME_TAG
      custom-model-data: 0
      nexo-id: ""
    wheel-success: LIME_STAINED_GLASS_PANE
    wheel-fail: RED_STAINED_GLASS_PANE
    wheel-needle: SPECTRAL_ARROW
  # Arte multi-slot. Solo se dibuja con menu-type: "nexo".
  # El resto de huecos sigue siendo el filler de arriba.
  nexo-art:
    - slots: [0, 1, 2, 3, 4, 5, 6, 7]
      material: PAPER
      custom-model-data: 88001
      increment-model-data: true
      nexo-id: ""
      name: " "
    - slots: [45, 46, 47, 48, 50, 51, 52, 53]
      material: PAPER
      custom-model-data: 88010
      increment-model-data: true
      nexo-id: ""
      name: " "
    - slots: [9, 18, 27, 36]
      material: PAPER
      custom-model-data: 88020
      increment-model-data: true
      nexo-id: ""
      name: " "
    - slots: [44]
      material: PAPER
      custom-model-data: 88024
      increment-model-data: true
      nexo-id: ""
      name: " "

browser:
  title: "&8Elige el premio"
  size: 54
  previous-slot: 45
  next-slot: 53
  back-slot: 49
  info-slot: 4
  content-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: " "
  icons:
    next: ARROW
    previous: ARROW
    back: BARRIER
    info: BOOK
    empty: BARRIER
