# Valor base al apostar un material vanilla. Lo que no esté listado usa defaults.vanilla.
# Los ítems de Nexo y de otros plugins no van aquí: se editan con /osirisupgrader base
# y quedan guardados en custom-items.yml.
# Un valor 0 bloquea el ítem.
#
# Límite de premio en un material vanilla: en vez de un número, puedes escribir value y max-win.
# max-win es cuántos puedes ganar por apuesta, con x2/x4/x8 o sin multiplicador.
# Si omites max-win, ese ítem no tiene límite.
defaults:
  vanilla: 1
  nexo: 25
  custom: 25

blocked-materials:
  - AIR
  - BEDROCK
  - BARRIER
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - JIGSAW
  - LIGHT
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - BUNDLE
  - PETRIFIED_OAK_SLAB

